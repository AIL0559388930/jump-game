 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عملة A - مدينة ثلاثية الأبعاد</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #090510;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    .hud-top {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 15;
    }

    .badge {
      background: rgba(24, 10, 16, 0.82);
      border: 1.5px solid rgba(255, 213, 79, 0.85);
      box-shadow: 0 0 14px rgba(255, 193, 7, 0.35);
      padding: 7px 12px;
      border-radius: 13px;
      font-weight: 700;
      font-size: 13px;
      color: #ffe082;
      backdrop-filter: blur(5px);
    }

    .social-bar {
      position: fixed;
      top: 58px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 15;
    }

    .social-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 224, 130, 0.7);
      background: rgba(20, 12, 28, 0.72);
      color: #fff8e1;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .joystick-zone {
      position: fixed;
      bottom: 28px;
      left: 24px;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: rgba(20, 14, 28, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    .joystick-knob {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, rgba(255, 224, 130, 0.8), rgba(255, 160, 0, 0.5));
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 18px rgba(255, 213, 79, 0.65);
      transform: translate(0px, 0px);
    }

    .action-buttons {
      position: fixed;
      bottom: 26px;
      right: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.22), rgba(25, 16, 36, 0.58));
      color: #fff3c4;
      font-size: 21px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div class="hud-top">
    <div class="badge">🪙 عملة A: <span id="coins">0</span></div>
    <div class="badge">⚡ الطاقة: <span id="energy">100%</span></div>
  </div>

  <div class="social-bar">
    <button class="social-btn" id="channelBtn">📢 قناة اللعبة</button>
    <button class="social-btn" id="inviteBtn">🎁 دعوة صديق</button>
  </div>

  <div class="joystick-zone" id="joystickZone">
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>

  <div class="action-buttons">
    <button class="action-btn" id="dashBtn" title="اندفاع">⚡</button>
    <button class="action-btn" id="jumpBtn" title="قفز">🏃</button>
  </div>

  <script>
    const CHANNEL_URL = "https://t.me/your_game_channel";
    const BOT_INVITE_BASE = "https://t.me/your_game_bot?start=ref_";

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    document.getElementById("channelBtn").addEventListener("click", () => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(CHANNEL_URL);
      else window.open(CHANNEL_URL, "_blank");
    });

    document.getElementById("inviteBtn").addEventListener("click", () => {
      const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "player";
      const inviteLink = `${BOT_INVITE_BASE}${userId}`;
      if (tg && tg.openTelegramLink) {
        const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${encodeURIComponent("جرّب مدينة عملة A ثلاثية الأبعاد الآن!")}`;
        tg.openTelegramLink(shareUrl);
      }
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c0716);
    scene.fog = new THREE.FogExp2(0x0c0716, 0.018);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffd54f, 1.1);
    dirLight.position.set(15, 25, 15);
    scene.add(dirLight);

    // أرضية المدينة
    const groundGeo = new THREE.PlaneGeometry(140, 140);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1426, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const grid = new THREE.GridHelper(140, 35, 0xffb300, 0x2c2040);
    grid.position.y = 0.02;
    scene.add(grid);

    // البطل (أحمر وذهبي مع هالة)
    const hero = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd91e2a, metalness: 0.4, roughness: 0.3 });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd54f, emissive: 0xffa000, emissiveIntensity: 0.4 });

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.5), bodyMat);
    torso.position.y = 1.45;
    hero.add(torso);

    const chestCore = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.12, 16), goldMat);
    chestCore.rotation.x = Math.PI / 2;
    chestCore.position.set(0, 1.65, 0.28);
    hero.add(chestCore);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.62, 0.62), bodyMat);
    head.position.y = 2.45;
    hero.add(head);

    const aura = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.03, 10, 32), goldMat);
    aura.rotation.x = Math.PI / 2.4;
    aura.position.y = 1.4;
    hero.add(aura);

    hero.position.set(0, 0, 8);
    scene.add(hero);

    // المباني (يمكن المرور بينها أو الصعود فوق المنخفضة منها)
    const buildings = [];
    const buildingDefs = [
      { x: -7, z: 0, w: 5, h: 10, d: 5, color: 0x221836, walkableTop: false },
      { x: 7, z: 0, w: 5, h: 12, d: 5, color: 0x2a1b3d, walkableTop: false },
      { x: 0, z: -8, w: 6, h: 2.2, d: 6, color: 0x38224a, walkableTop: true }, // منصة/مبنى منخفض للمشي فوقه
      { x: -8, z: -14, w: 6, h: 14, d: 6, color: 0x1f1630, walkableTop: false },
      { x: 8, z: -14, w: 6, h: 11, d: 6, color: 0x261a3b, walkableTop: false },
      { x: 0, z: -22, w: 7, h: 3.5, d: 6, color: 0x3d2452, walkableTop: true }
    ];

    buildingDefs.forEach((b) => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, b.h, b.d),
        new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.5 })
      );
      mesh.position.set(b.x, b.h / 2, b.z);
      scene.add(mesh);

      // شريط إضاءة ذهبي أعلى المبنى
      const trim = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.1, 0.18, b.d + 0.1), goldMat);
      trim.position.set(b.x, b.h, b.z);
      scene.add(trim);

      buildings.push({ ...b, topY: b.h });
    });

    // عملات A ثلاثية الأبعاد
    const coinMeshes = [];
    const coinPositions = [
      [0, 1.4, 3], [0, 3.6, -8], [3, 1.4, -4], [-3, 1.4, -4],
      [0, 1.4, -14], [0, 4.9, -22], [4, 1.4, -18], [-4, 1.4, -18]
    ];

    coinPositions.forEach(([x, y, z]) => {
      const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.12, 20), goldMat);
      coin.rotation.x = Math.PI / 2;
      coin.position.set(x, y, z);
      scene.add(coin);
      coinMeshes.push({ mesh: coin, collected: false });
    });

    // التحكم
    let moveX = 0, moveZ = 0;
    let velY = 0;
    let groundY = 0;
    let dashTime = 0;
    let energy = 100;
    let coinsCount = Number(localStorage.getItem("coinA_score") || 0);

    const coinsEl = document.getElementById("coins");
    const energyEl = document.getElementById("energy");
    coinsEl.textContent = coinsCount;

    const joyZone = document.getElementById("joystickZone");
    const joyKnob = document.getElementById("joystickKnob");
    let joyActive = false;

    function handleJoy(touch) {
      const rect = joyZone.getBoundingClientRect();
      const maxR = rect.width / 2 - 22;
      let dx = touch.clientX - (rect.left + rect.width / 2);
      let dy = touch.clientY - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveX = dx / maxR;
      moveZ = dy / maxR;
    }

    joyZone.addEventListener("touchstart", (e) => { joyActive = true; handleJoy(e.touches[0]); });
    joyZone.addEventListener("touchmove", (e) => { if (joyActive) handleJoy(e.touches[0]); });
    const stopJoy = () => { joyActive = false; moveX = 0; moveZ = 0; joyKnob.style.transform = "translate(0px, 0px)"; };
    joyZone.addEventListener("touchend", stopJoy);
    joyZone.addEventListener("touchcancel", stopJoy);

    function jump() {
      if (Math.abs(hero.position.y - groundY) < 0.05) {
        velY = 0.24;
      }
    }
    document.getElementById("jumpBtn").addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
    document.getElementById("jumpBtn").addEventListener("click", jump);

    function dash() {
      if (energy >= 20 && dashTime <= 0) {
        dashTime = 14;
        energy -= 20;
        energyEl.textContent = energy + "%";
      }
    }
    document.getElementById("dashBtn").addEventListener("touchstart", (e) => { e.preventDefault(); dash(); });
    document.getElementById("dashBtn").addEventListener("click", dash);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") moveX = -1;
      if (e.key === "ArrowRight" || e.key === "d") moveX = 1;
      if (e.key === "ArrowUp" || e.key === "w") moveZ = -1;
      if (e.key === "ArrowDown" || e.key === "s") moveZ = 1;
      if (e.key === " ") jump();
      if (e.key === "Shift") dash();
    });
    window.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "ArrowRight", "a", "d"].includes(e.key)) moveX = 0;
      if (["ArrowUp", "ArrowDown", "w", "s"].includes(e.key)) moveZ = 0;
    });

    function resolveHorizontalCollisions(prevX, prevZ) {
      const radius = 0.55;
      for (const b of buildings) {
        const halfW = b.w / 2 + radius;
        const halfD = b.d / 2 + radius;
        const insideX = Math.abs(hero.position.x - b.x) < halfW;
        const insideZ = Math.abs(hero.position.z - b.z) < halfD;

        if (insideX && insideZ) {
          // السماح بالصعود فوق المبنى إذا كان البطل فوق سطحه أو قفز قريباً من حافته
          if (b.walkableTop && hero.position.y >= b.topY - 0.35) {
            continue;
          }
          hero.position.x = prevX;
          hero.position.z = prevZ;
        }
      }
    }

    function updateGroundHeight() {
      let highest = 0;
      for (const b of buildings) {
        if (!b.walkableTop) continue;
        const insideX = Math.abs(hero.position.x - b.x) <= b.w / 2 + 0.25;
        const insideZ = Math.abs(hero.position.z - b.z) <= b.d / 2 + 0.25;
        if (insideX && insideZ && hero.position.y >= b.topY - 0.4) {
          if (b.topY > highest) highest = b.topY;
        }
      }
      groundY = highest;
    }

    function animate() {
      requestAnimationFrame(animate);

      if (energy < 100 && Math.random() < 0.04) {
        energy++;
        energyEl.textContent = energy + "%";
      }

      const speed = dashTime > 0 ? 0.34 : 0.15;
      if (dashTime > 0) dashTime--;

      const prevX = hero.position.x;
      const prevZ = hero.position.z;

      if (Math.hypot(moveX, moveZ) > 0.08) {
        hero.position.x += moveX * speed;
        hero.position.z += moveZ * speed;
        hero.rotation.y = Math.atan2(moveX, moveZ);
      }

      resolveHorizontalCollisions(prevX, prevZ);
      updateGroundHeight();

      velY -= 0.012;
      hero.position.y += velY;
      if (hero.position.y <= groundY) {
        hero.position.y = groundY;
        velY = 0;
      }

      aura.rotation.z += 0.05;

      coinMeshes.forEach((item) => {
        if (item.collected) return;
        item.mesh.rotation.y += 0.04;
        if (hero.position.distanceTo(item.mesh.position) < 1.5) {
          item.collected = true;
          item.mesh.visible = false;
          coinsCount += 10;
          coinsEl.textContent = coinsCount;
          localStorage.setItem("coinA_score", coinsCount);
        }
      });

      const targetCamX = hero.position.x;
      const targetCamY = hero.position.y + 5.5;
      const targetCamZ = hero.position.z + 8.5;
      camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
      camera.lookAt(hero.position.x, hero.position.y + 1.5, hero.position.z - 2);

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
