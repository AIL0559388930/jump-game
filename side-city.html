 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عملة A - مدينة النيون</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #090511;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud-top {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 15;
      gap: 8px;
    }

    .badge {
      background: rgba(18, 9, 24, 0.82);
      border: 1.5px solid rgba(255, 213, 79, 0.85);
      box-shadow: 0 0 16px rgba(255, 193, 7, 0.28);
      padding: 8px 13px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      color: #ffe082;
      backdrop-filter: blur(6px);
    }

    .social-bar {
      position: fixed;
      top: 58px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 15;
    }

    .social-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 13px;
      border: 1px solid rgba(255, 224, 130, 0.72);
      background: rgba(18, 10, 28, 0.78);
      color: #fff8e1;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .social-btn:active {
      transform: scale(0.96);
      border-color: #ffd54f;
    }

    .joystick-zone {
      position: fixed;
      bottom: 28px;
      left: 24px;
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: rgba(18, 12, 28, 0.38);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(5px);
    }

    .joystick-knob {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, rgba(255, 224, 130, 0.85), rgba(255, 160, 0, 0.5));
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 18px rgba(255, 213, 79, 0.65);
      transform: translate(0px, 0px);
    }

    .action-buttons {
      position: fixed;
      bottom: 26px;
      right: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.42);
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.22), rgba(25, 14, 36, 0.62));
      color: #fff3c4;
      font-size: 21px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .action-btn:active {
      transform: scale(0.92);
      border-color: #ffd54f;
      box-shadow: 0 0 18px rgba(255, 213, 79, 0.75);
    }

    .toast {
      position: fixed;
      bottom: 165px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 10, 28, 0.92);
      border: 1px solid rgba(255, 213, 79, 0.85);
      color: #ffe082;
      padding: 9px 15px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 30;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="hud-top">
    <div class="badge">🪙 عملة A: <span id="coins">0</span></div>
    <div class="badge">⚡ الطاقة: <span id="energy">100%</span></div>
  </div>

  <div class="social-bar">
    <button class="social-btn" id="channelBtn">📢 قناة اللعبة</button>
    <button class="social-btn" id="inviteBtn">🎁 دعوة صديق</button>
  </div>

  <div class="toast" id="toast"></div>

  <canvas id="gameCanvas"></canvas>

  <div class="joystick-zone" id="joystickZone">
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>

  <div class="action-buttons">
    <button class="action-btn" id="dashBtn" title="اندفاع">⚡</button>
    <button class="action-btn" id="jumpBtn" title="قفز">🏃</button>
  </div>

  <script>
    const CHANNEL_URL = "https://t.me/your_game_channel";
    const BOT_INVITE_BASE = "https://t.me/your_game_bot?start=ref_";

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const toastEl = document.getElementById("toast");
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    document.getElementById("channelBtn").addEventListener("click", () => {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(CHANNEL_URL);
      } else {
        window.open(CHANNEL_URL, "_blank");
      }
    });

    document.getElementById("inviteBtn").addEventListener("click", () => {
      const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "player";
      const inviteLink = `${BOT_INVITE_BASE}${userId}`;
      if (tg && tg.openTelegramLink) {
        const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${encodeURIComponent("جرّب لعبة عملة A في مدينة النيون وابدأ اللعب الآن!")}`;
        tg.openTelegramLink(shareUrl);
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(inviteLink).then(() => showToast("تم نسخ رابط الدعوة"));
      }
    });

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const bgImg = new Image();
    bgImg.src = "./hero-bg.jpg";
    let bgLoaded = false;
    bgImg.onload = () => {
      bgLoaded = true;
    };

    let coinsCount = Number(localStorage.getItem("coinA_score") || 0);
    let energy = 100;
    let moveInputX = 0;
    let dashTimer = 0;
    let offsetX = 0;
    let jumpOffsetY = 0;
    let jumpVelY = 0;
    let isJumping = false;

    const coinsEl = document.getElementById("coins");
    const energyEl = document.getElementById("energy");
    coinsEl.textContent = coinsCount;

    const coins = [];
    for (let i = 1; i <= 24; i++) {
      coins.push({
        x: i * 170 + 90,
        yRatio: i % 2 === 0 ? 0.56 : 0.46,
        collected: false,
        pulse: i * 0.65
      });
    }

    const joyZone = document.getElementById("joystickZone");
    const joyKnob = document.getElementById("joystickKnob");
    let joyActive = false;

    function updateJoystick(clientX) {
      const rect = joyZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const maxDist = rect.width / 2 - 22;
      let dx = clientX - centerX;
      if (dx > maxDist) dx = maxDist;
      if (dx < -maxDist) dx = -maxDist;

      joyKnob.style.transform = `translate(${dx}px, 0px)`;
      moveInputX = dx / maxDist;
    }

    joyZone.addEventListener("touchstart", (e) => {
      joyActive = true;
      updateJoystick(e.touches[0].clientX);
    });
    joyZone.addEventListener("touchmove", (e) => {
      if (!joyActive) return;
      updateJoystick(e.touches[0].clientX);
    });
    const resetJoystick = () => {
      joyActive = false;
      moveInputX = 0;
      joyKnob.style.transform = `translate(0px, 0px)`;
    };
    joyZone.addEventListener("touchend", resetJoystick);
    joyZone.addEventListener("touchcancel", resetJoystick);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "d") moveInputX = 1;
      if (e.key === "ArrowLeft" || e.key === "a") moveInputX = -1;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") jump();
      if (e.key === "Shift") dash();
    });
    window.addEventListener("keyup", (e) => {
      if (["ArrowRight", "ArrowLeft", "a", "d"].includes(e.key)) moveInputX = 0;
    });

    function jump() {
      if (!isJumping) {
        jumpVelY = -12;
        isJumping = true;
      }
    }
    document.getElementById("jumpBtn").addEventListener("touchstart", (e) => {
      e.preventDefault();
      jump();
    });
    document.getElementById("jumpBtn").addEventListener("click", jump);

    function dash() {
      if (energy >= 20 && dashTimer <= 0) {
        dashTimer = 16;
        energy -= 20;
        energyEl.textContent = energy + "%";
      }
    }
    document.getElementById("dashBtn").addEventListener("touchstart", (e) => {
      e.preventDefault();
      dash();
    });
    document.getElementById("dashBtn").addEventListener("click", dash);

    function drawScene() {
      ctx.fillStyle = "#090511";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (bgLoaded) {
        const scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
        const drawW = bgImg.width * scale;
        const drawH = bgImg.height * scale;
        const panX = Math.max(Math.min(-offsetX * 0.22, 0), canvas.width - drawW);
        const panY = (canvas.height - drawH) * 0.5 + jumpOffsetY * 0.45;
        ctx.drawImage(bgImg, panX, panY, drawW, drawH);
      } else {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, "#190d29");
        grad.addColorStop(1, "#090511");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (dashTimer > 0) {
        ctx.fillStyle = "rgba(255, 213, 79, 0.14)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function drawCoins() {
      coins.forEach((c) => {
        if (c.collected) return;
        c.pulse += 0.08;
        const span = canvas.width + 220;
        const screenX = ((c.x - offsetX) % span + span) % span - 40;
        const finalY = canvas.height * c.yRatio + Math.sin(c.pulse) * 6;

        ctx.beginPath();
        ctx.arc(screenX, finalY, 21, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 213, 79, 0.24)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(screenX, finalY, 14, 0, Math.PI * 2);
        ctx.fillStyle = "#ffc107";
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = "#fff8e1";
        ctx.stroke();

        ctx.fillStyle = "#451300";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("A", screenX, finalY + 1);
      });
    }

    function update() {
      if (energy < 100 && Math.random() < 0.04) {
        energy++;
        energyEl.textContent = energy + "%";
      }

      let speed = 5.5;
      if (dashTimer > 0) {
        speed = 13;
        dashTimer--;
      }

      if (Math.abs(moveInputX) > 0.08) {
        offsetX += moveInputX * speed;
      }

      if (isJumping) {
        jumpOffsetY += jumpVelY;
        jumpVelY += 0.7;
        if (jumpOffsetY >= 0) {
          jumpOffsetY = 0;
          jumpVelY = 0;
          isJumping = false;
        }
      }

      const centerX = canvas.width * 0.5;
      const centerY = canvas.height * 0.52 + jumpOffsetY;
      const span = canvas.width + 220;

      coins.forEach((c) => {
        if (c.collected) return;
        const screenX = ((c.x - offsetX) % span + span) % span - 40;
        const finalY = canvas.height * c.yRatio;
        if (Math.hypot(centerX - screenX, centerY - finalY) < 54) {
          c.collected = true;
          coinsCount += 10;
          coinsEl.textContent = coinsCount;
          localStorage.setItem("coinA_score", coinsCount);
        }
      });
    }

    function loop() {
      update();
      drawScene();
      drawCoins();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
