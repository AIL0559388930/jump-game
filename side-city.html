 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عملة A - تجربة المدينة الجانبية</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0c0714;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .badge {
      background: rgba(24, 10, 16, 0.82);
      border: 1.5px solid rgba(255, 213, 79, 0.85);
      box-shadow: 0 0 14px rgba(255, 193, 7, 0.35);
      padding: 8px 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      color: #ffe082;
      backdrop-filter: blur(5px);
    }

    .joystick-zone {
      position: fixed;
      bottom: 28px;
      left: 24px;
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: rgba(20, 14, 28, 0.42);
      border: 1.5px solid rgba(255, 255, 255, 0.32);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.08), 0 0 16px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    .joystick-knob {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, rgba(255, 224, 130, 0.72), rgba(255, 160, 0, 0.45));
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 0 18px rgba(255, 213, 79, 0.65);
      transform: translate(0px, 0px);
    }

    .action-buttons {
      position: fixed;
      bottom: 26px;
      right: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.36);
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.18), rgba(25, 16, 36, 0.58));
      color: #fff3c4;
      font-size: 21px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
    }

    .action-btn:active {
      transform: scale(0.92);
      border-color: #ffd54f;
      box-shadow: 0 0 18px rgba(255, 213, 79, 0.75);
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="badge">🪙 عملة A: <span id="coins">0</span></div>
    <div class="badge">⚡ الطاقة: <span id="energy">100%</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="joystick-zone" id="joystickZone">
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>

  <div class="action-buttons">
    <button class="action-btn" id="dashBtn" title="اندفاع سريع">⚡</button>
    <button class="action-btn" id="jumpBtn" title="قفز">🏃</button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let coinsCount = 0;
    let energy = 100;
    let cameraX = 0;
    let moveInputX = 0;
    let dashTimer = 0;
    let auraPhase = 0;

    const coinsEl = document.getElementById("coins");
    const energyEl = document.getElementById("energy");

    function getGroundY() {
      return canvas.height - 152;
    }

    const hero = {
      x: 160,
      y: getGroundY(),
      vx: 0,
      vy: 0,
      facing: 1,
      onGround: true,
      walkCycle: 0,
      trail: []
    };

    const buildings = [];
    for (let i = -6; i < 80; i++) {
      const seed = Math.abs(i * 97 + 13);
      buildings.push({
        x: i * 165,
        w: 122 + (seed % 48),
        h: 210 + (seed % 235),
        bodyTone: i % 2 === 0 ? "#181426" : "#221a33",
        neonColor: i % 3 === 0 ? "#ff6ec7" : (i % 3 === 1 ? "#ffd54f" : "#4dd0e1"),
        hasShopfront: i % 2 === 0
      });
    }

    const coins = [];
    for (let i = 1; i <= 60; i++) {
      coins.push({
        x: i * 190 + 140,
        y: getGroundY() - (i % 3 === 0 ? 120 : 48),
        collected: false,
        pulse: i * 0.55
      });
    }

    const joyZone = document.getElementById("joystickZone");
    const joyKnob = document.getElementById("joystickKnob");
    let joyActive = false;

    function updateJoystick(clientX) {
      const rect = joyZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const maxDist = rect.width / 2 - 22;
      let dx = clientX - centerX;
      if (dx > maxDist) dx = maxDist;
      if (dx < -maxDist) dx = -maxDist;

      joyKnob.style.transform = `translate(${dx}px, 0px)`;
      moveInputX = dx / maxDist;
    }

    joyZone.addEventListener("touchstart", (e) => {
      joyActive = true;
      updateJoystick(e.touches[0].clientX);
    });
    joyZone.addEventListener("touchmove", (e) => {
      if (!joyActive) return;
      updateJoystick(e.touches[0].clientX);
    });
    const resetJoystick = () => {
      joyActive = false;
      moveInputX = 0;
      joyKnob.style.transform = `translate(0px, 0px)`;
    };
    joyZone.addEventListener("touchend", resetJoystick);
    joyZone.addEventListener("touchcancel", resetJoystick);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "d") moveInputX = 1;
      if (e.key === "ArrowLeft" || e.key === "a") moveInputX = -1;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") jump();
      if (e.key === "Shift") dash();
    });
    window.addEventListener("keyup", (e) => {
      if (["ArrowRight", "ArrowLeft", "a", "d"].includes(e.key)) moveInputX = 0;
    });

    function jump() {
      if (hero.onGround) {
        hero.vy = -16;
        hero.onGround = false;
      }
    }
    document.getElementById("jumpBtn").addEventListener("touchstart", (e) => {
      e.preventDefault();
      jump();
    });
    document.getElementById("jumpBtn").addEventListener("click", jump);

    function dash() {
      if (energy >= 20 && dashTimer <= 0) {
        dashTimer = 16;
        energy -= 20;
        energyEl.textContent = energy + "%";
      }
    }
    document.getElementById("dashBtn").addEventListener("touchstart", (e) => {
      e.preventDefault();
      dash();
    });
    document.getElementById("dashBtn").addEventListener("click", dash);

    function drawCity() {
      const groundY = getGroundY();

      const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
      skyGrad.addColorStop(0, "#141024");
      skyGrad.addColorStop(0.55, "#3a2342");
      skyGrad.addColorStop(0.85, "#8b5a5c");
      skyGrad.addColorStop(1, "#cfa086");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, groundY);

      buildings.forEach((b) => {
        const screenX = b.x - cameraX * 0.58;
        if (screenX + b.w < -140 || screenX > canvas.width + 140) return;

        ctx.fillStyle = b.bodyTone;
        ctx.fillRect(screenX, groundY - b.h, b.w, b.h);

        ctx.save();
        ctx.shadowColor = b.neonColor;
        ctx.shadowBlur = 12;
        ctx.fillStyle = b.neonColor;
        ctx.fillRect(screenX + 12, groundY - b.h + 26, b.w - 24, 14);
        ctx.restore();

        for (let wy = groundY - b.h + 56; wy < groundY - 58; wy += 26) {
          for (let wx = screenX + 14; wx < screenX + b.w - 22; wx += 22) {
            const lit = ((Math.floor(wx + wy)) % 3) !== 0;
            ctx.fillStyle = lit ? "rgba(255, 236, 179, 0.24)" : "rgba(12, 10, 20, 0.45)";
            ctx.fillRect(wx, wy, 10, 13);
          }
        }

        if (b.hasShopfront) {
          const shopY = groundY - 66;
          ctx.fillStyle = "rgba(255, 224, 178, 0.16)";
          ctx.fillRect(screenX + 6, shopY, b.w - 12, 66);

          const stripes = 6;
          const sw = (b.w - 12) / stripes;
          for (let s = 0; s < stripes; s++) {
            ctx.fillStyle = s % 2 === 0 ? "#c62828" : "#fff8e1";
            ctx.fillRect(screenX + 6 + s * sw, shopY - 10, sw, 12);
          }
        }
      });

      const sidewalkGrad = ctx.createLinearGradient(0, groundY, 0, groundY + 24);
      sidewalkGrad.addColorStop(0, "#7d7482");
      sidewalkGrad.addColorStop(1, "#4a4350");
      ctx.fillStyle = sidewalkGrad;
      ctx.fillRect(0, groundY, canvas.width, 24);

      ctx.fillStyle = "#181522";
      ctx.fillRect(0, groundY + 24, canvas.width, canvas.height - groundY);

      ctx.fillStyle = "#ffd54f";
      const stripeOffset = -(cameraX % 96);
      for (let sx = stripeOffset; sx < canvas.width + 96; sx += 96) {
        ctx.fillRect(sx, groundY + 72, 48, 6);
      }
    }

    function drawCoins() {
      coins.forEach((c) => {
        if (c.collected) return;
        c.pulse += 0.08;
        const screenX = c.x - cameraX;
        if (screenX < -50 || screenX > canvas.width + 50) return;

        const floatY = c.y + Math.sin(c.pulse) * 6;

        ctx.beginPath();
        ctx.arc(screenX, floatY, 20, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 213, 79, 0.25)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(screenX, floatY, 13.5, 0, Math.PI * 2);
        ctx.fillStyle = "#ffc107";
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = "#fff8e1";
        ctx.stroke();

        ctx.fillStyle = "#4e1600";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("A", screenX, floatY + 1);
      });
    }

    function drawHero() {
      const screenX = hero.x - cameraX;
      const groundY = getGroundY();
      const isMoving = Math.abs(hero.vx) > 0.4;
      const bobY = (hero.onGround && isMoving) ? Math.abs(Math.sin(hero.walkCycle)) * 5 : 0;
      const swing = hero.onGround ? Math.sin(hero.walkCycle) * (isMoving ? 13 : 2) : 10;

      ctx.beginPath();
      ctx.ellipse(screenX, groundY + 6, 28, 7, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fill();

      hero.trail.forEach((t, idx) => {
        const alpha = (idx / hero.trail.length) * 0.45;
        ctx.strokeStyle = `rgba(255, 213, 79, ${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(t.x - cameraX, t.y - 48, 30, -0.8, 1.3);
        ctx.stroke();
      });

      ctx.save();
      ctx.translate(screenX, groundY - bobY);
      ctx.scale(hero.facing * 1.18, 1.18);

      ctx.save();
      ctx.shadowColor = "#ffd54f";
      ctx.shadowBlur = 12;
      ctx.strokeStyle = "rgba(255, 236, 179, 0.78)";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.ellipse(0, -45, 28, 38, -0.25 + Math.sin(auraPhase) * 0.06, 0.1, Math.PI * 1.85);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 193, 7, 0.52)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(0, -42, 24, 32, 0.35 - Math.cos(auraPhase) * 0.06, 0.4, Math.PI * 1.7);
      ctx.stroke();
      ctx.restore();

      const legGrad = ctx.createLinearGradient(-14, -36, 14, 0);
      legGrad.addColorStop(0, "#d32f2f");
      legGrad.addColorStop(0.65, "#8e0000");
      legGrad.addColorStop(1, "#23121b");

      ctx.strokeStyle = legGrad;
      ctx.lineWidth = 9.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-5, -35);
      ctx.lineTo(-5 - swing, -3);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(5, -35);
      ctx.lineTo(5 + swing, -3);
      ctx.stroke();

      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-6, -24);
      ctx.lineTo(-5 - swing * 0.7, -9);
      ctx.moveTo(6, -24);
      ctx.lineTo(5 + swing * 0.7, -9);
      ctx.stroke();

      const armorGrad = ctx.createLinearGradient(-18, -68, 18, -32);
      armorGrad.addColorStop(0, "#ff4b4b");
      armorGrad.addColorStop(0.5, "#b71c1c");
      armorGrad.addColorStop(1, "#2a141e");
      ctx.fillStyle = armorGrad;
      ctx.beginPath();
      ctx.moveTo(-17, -64);
      ctx.quadraticCurveTo(0, -70, 17, -64);
      ctx.lineTo(12, -33);
      ctx.quadraticCurveTo(0, -29, -12, -33);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-15, -59);
      ctx.lineTo(-5, -50);
      ctx.moveTo(15, -59);
      ctx.lineTo(5, -50);
      ctx.moveTo(-11, -34);
      ctx.lineTo(11, -34);
      ctx.stroke();

      ctx.save();
      ctx.shadowColor = "#ffd54f";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#fff9c4";
      ctx.beginPath();
      ctx.arc(2, -49, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = "#d32f2f";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(3, -59);
      ctx.lineTo(3 - swing * 0.85, -36);
      ctx.stroke();

      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(2 - swing * 0.7, -41);
      ctx.lineTo(4 - swing * 0.7, -40);
      ctx.stroke();

      ctx.fillStyle = "#d32f2f";
      ctx.beginPath();
      ctx.arc(0, -77, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffd54f";
      ctx.beginPath();
      ctx.moveTo(-6, -86);
      ctx.lineTo(-11, -98);
      ctx.lineTo(0, -87);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(4, -86);
      ctx.lineTo(9, -97);
      ctx.lineTo(8, -85);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      ctx.shadowColor = "#ffe082";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#fffde7";
      ctx.beginPath();
      ctx.moveTo(1, -79);
      ctx.lineTo(11, -81);
      ctx.lineTo(7, -74);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    function update() {
      const groundY = getGroundY();
      auraPhase += 0.08;

      if (energy < 100 && Math.random() < 0.04) {
        energy++;
        energyEl.textContent = energy + "%";
      }

      let speed = 5.4;
      if (dashTimer > 0) {
        speed = 12.8;
        dashTimer--;
      }

      if (Math.abs(moveInputX) > 0.08) {
        hero.vx = moveInputX * speed;
        hero.facing = moveInputX > 0 ? 1 : -1;
        hero.walkCycle += 0.28;
      } else {
        hero.vx *= 0.78;
      }

      hero.x += hero.vx;

      hero.vy += 0.8;
      hero.y += hero.vy;

      if (hero.y >= groundY) {
        hero.y = groundY;
        hero.vy = 0;
        hero.onGround = true;
      }

      if (Math.abs(hero.vx) > 2.2 || dashTimer > 0) {
        hero.trail.push({ x: hero.x, y: hero.y });
        if (hero.trail.length > 7) hero.trail.shift();
      } else if (hero.trail.length > 0) {
        hero.trail.shift();
      }

      const targetCam = hero.x - canvas.width * 0.35;
      cameraX += (targetCam - cameraX) * 0.12;

      coins.forEach((c) => {
        if (c.collected) return;
        const dx = hero.x - c.x;
        const dy = (hero.y - 45) - c.y;
        if (Math.hypot(dx, dy) < 44) {
          c.collected = true;
          coinsCount += 10;
          coinsEl.textContent = coinsCount;
        }
      });
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      update();
      drawCity();
      drawCoins();
      drawHero();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
