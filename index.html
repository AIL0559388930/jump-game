 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العب واكسب - مغامرة اللاعب</title>
    <!-- مكتبة إعلانات Adsgram SDK المحدثة -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #2c3e50;
            text-align: center;
            margin: 0;
            padding: 10px;
            color: #fff;
        }
        .game-container {
            background: #34495e;
            max-width: 400px;
            margin: 10px auto;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        canvas {
            background: #87CEEB;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }
        .score-board {
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .jump-btn {
            background-color: #d35400;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px #ba4a00;
        }
        .jump-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #ba4a00;
        }
        .ton-wallet-box {
            background: #1b2631;
            border: 2px solid #0088cc;
            border-radius: 10px;
            margin-top: 12px;
            padding: 10px;
            text-align: right;
        }
        .wallet-header {
            font-size: 13px;
            color: #3498db;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .wallet-balance {
            font-size: 12px;
            color: #bdc3c7;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: ltr;
        }
        .wallet-balance span {
            text-align: right;
        }
        .wallet-total {
            font-size: 13px;
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 8px;
            border-top: 1px dashed #4b6584;
            padding-top: 4px;
            direction: ltr;
            text-align: left;
        }
        .wallet-input {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            border-radius: 5px;
            border: 1px solid #7f8c8d;
            background: #2c3e50;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 6px;
            direction: ltr;
            text-align: left;
        }
        .wallet-input.ar {
            direction: rtl;
            text-align: right;
        }
        .wallet-btn-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .action-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 7px;
            font-size: 11px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        .withdraw-btn {
            background-color: #27ae60;
        }
        .support-btn {
            background-color: #8e44ad;
        }
        .small-withdraw-btn {
            background-color: #7f8c8d;
            color: #bdc3c7;
            border: none;
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            cursor: not-allowed;
            font-weight: bold;
        }
        /* نافذة الإعلان الترحيبي عند فتح البوت */
        #adOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .ad-popup-box {
            background: #34495e;
            padding: 20px;
            border-radius: 12px;
            max-width: 320px;
            width: 100%;
            border: 2px solid #f1c40f;
            text-align: center;
        }
        .ad-popup-box h3 {
            color: #f1c40f;
            margin-top: 0;
        }
        .ad-popup-box p {
            font-size: 14px;
            color: #ecf0f1;
            line-height: 1.5;
        }
        .ad-play-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- نافذة الإعلان تظهر عند فتح البوت لأول مرة في الجلسة -->
    <div id="adOverlay" style="display: none;">
        <div class="ad-popup-box">
            <h3>📺 أهلاً بك في البوت</h3>
            <p>مشاهدة هذا الإعلان القصير تتيح لك الدخول إلى اللعبة وبدء التحدي والربح!</p>
            <button class="ad-play-btn" onclick="playWelcomeAd()">مشاهدة الإعلان واللعب</button>
        </div>
    </div>

    <div class="game-container">
        <h2>🎮 العب واكسب</h2>
        <div class="score-board">النقاط: <span id="score">0</span></div>
        
        <canvas id="gameCanvas" width="350" height="170"></canvas>
        
        <button class="jump-btn" onclick="makeJump()">اضغط ليقفز اللاعب 🏃‍♂️</button>

        <!-- محفظة أرباح اللاعب -->
        <div class="ton-wallet-box">
            <div class="wallet-header">💎 محفظة أرباح اللاعب</div>
            
            <div class="wallet-balance">
                <button class="small-withdraw-btn" title="السحب مقفل">سحب عملة A (قريباً)</button>
                <span>رصيد عملة A: <span id="gameCoins" style="color: #2ecc71; font-weight: bold;">0</span> A</span>
            </div>

            <div class="wallet-balance" style="justify-content: flex-end;">
                <span>رصيد أرباح اللعب (TON): <span id="playTon">0.0000</span> TON</span>
            </div>

            <div class="wallet-total">
                إجمالي أرباحك القابلة للسحب: <span id="tonTotal">0.0000</span> TON (≈ $<span id="usdTotal">0.0000</span>)
            </div>
            
            <input type="email" id="playerEmail" class="wallet-input ar" placeholder="اكتب بريدك الإلكتروني (الإيميل) هنا">
            <input type="text" id="walletAddress" class="wallet-input" placeholder="اكتب عنوان محفظة TON هنا (EQ...)">
            
            <!-- مجموعة الأزرار الأولى -->
            <div class="wallet-btn-group">
                <button class="action-btn" onclick="saveInfo()">حفظ البيانات</button>
                <button class="action-btn" onclick="watchExtraAdForFun()">📺 شاهد إعلان</button>
            </div>

            <!-- مجموعة الأزرار الثانية (سحب الأرباح والدعم الفني) -->
            <div class="wallet-btn-group">
                <button class="action-btn withdraw-btn" onclick="requestWithdraw()">طلب سحب الأرباح</button>
                <button class="action-btn support-btn" onclick="openSupport()">🎧 الدعم الفني</button>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "9291259275:AAG1gzTgTwf2B0bhCaXEU-uwCmNPVtBIWDU"; 
        const ADMIN_CHAT_ID = "6900706731";

        async function sendTelegramNotification(message) {
            try {
                let response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: message
                    })
                });
                return response.ok;
            } catch (error) {
                console.error('Telegram Error:', error);
                return false;
            }
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = parseInt(localStorage.getItem('pe_score')) || 0;
        let gameCoins = parseInt(localStorage.getItem('pe_coins')) || 0;
        let playUSD = parseFloat(localStorage.getItem('pe_playUSD')) || 0.0000;
        
        let savedEmail = localStorage.getItem('pe_email') || "";
        let savedWallet = localStorage.getItem('pe_wallet') || "";

        if(savedEmail) document.getElementById("playerEmail").value = savedEmail;
        if(savedWallet) document.getElementById("walletAddress").value = savedWallet;

        let isGameOver = false;
        const tonPriceInUSD = 5.0; 
        const minWithdrawTON = 0.05;

        let amir = {
            x: 40,
            y: 95,
            width: 30,
            height: 35,
            dy: 0,
            jumpPower: -10,
            gravity: 0.55,
            grounded: true
        };

        const carTypes = ["🚙", "🚗", "🚕", "🚐"];
        
        let obstacle = {
            x: 350,
            y: 100,
            width: 30,
            height: 30,
            speed: 2.0,
            currentCar: "🚙"
        };

        let buildings = [
            { x: 0, width: 60, height: 75, color: "#7f8c8d" },
            { x: 70, width: 70, height: 95, color: "#95a5a6" },
            { x: 150, width: 65, height: 85, color: "#BDC3C7" },
            { x: 225, width: 75, height: 105, color: "#65737e" },
            { x: 310, width: 60, height: 80, color: "#546e7a" }
        ];

        function getRandomCar() {
            return carTypes[Math.floor(Math.random() * carTypes.length)];
        }

        // التحقق من جلسة الدخول لإظهار الإعلان عند فتح البوت أول مرة
        window.addEventListener('load', () => {
            if (!sessionStorage.getItem('welcomed_ad_shown')) {
                document.getElementById('adOverlay').style.display = 'flex';
            }
        });

        // تهيئة وحدة الإعلانات بمعرفك الجديد (60176)
        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "60176" }) : null;

        // دالة تشغيل الإعلان الترحيبي أو الإضافي
        function playWelcomeAd() {
            if (adController) {
                adController.show().then(() => {
                    sessionStorage.setItem('welcomed_ad_shown', 'true');
                    document.getElementById('adOverlay').style.display = 'none';
                }).catch((result) => {
                    console.log("Ad error or skipped", result);
                    alert("يجب إكمال مشاهدة الإعلان للدخول.");
                });
            } else {
                sessionStorage.setItem('welcomed_ad_shown', 'true');
                document.getElementById('adOverlay').style.display = 'none';
            }
        }

        function openSupport() {
            window.open('https://t.me/AIL05593889', '_blank');
        }

        function makeJump() {
            if (amir.grounded && !isGameOver) {
                amir.dy = amir.jumpPower;
                amir.grounded = false;
            } else if (isGameOver) {
                resetGame(); 
            }
        }

        function updateBalances() {
            let playTON = playUSD / tonPriceInUSD;
            
            document.getElementById("gameCoins").innerText = gameCoins;
            document.getElementById("playTon").innerText = playTON.toFixed(4);
            document.getElementById("tonTotal").innerText = playTON.toFixed(4);
            document.getElementById("usdTotal").innerText = playUSD.toFixed(4);

            localStorage.setItem('pe_score', score);
            localStorage.setItem('pe_coins', gameCoins);
            localStorage.setItem('pe_playUSD', playUSD);
        }

        function update() {
            if (isGameOver) return;

            amir.dy += amir.gravity;
            amir.y += amir.dy;

            if (amir.y > 95) {
                amir.y = 95;
                amir.dy = 0;
                amir.grounded = true;
            }

            buildings.forEach(b => {
                b.x -= 0.3;
                if (b.x + b.width < 0) {
                    b.x = canvas.width;
                }
            });

            obstacle.x -= obstacle.speed;
            if (obstacle.x < -30) {
                obstacle.x = 350;
                obstacle.currentCar = getRandomCar();
                score += 10;
                gameCoins += 1; 
                playUSD += 0.00025; 
                updateBalances();
            }

            let amirBox = { x: amir.x + 6, y: amir.y + 6, width: amir.width - 12, height: amir.height - 8 };
            let carBox = { x: obstacle.x + 4, y: obstacle.y + 6, width: obstacle.width - 8, height: obstacle.height - 6 };

            if (
                amirBox.x < carBox.x + carBox.width &&
                amirBox.x + amirBox.width > carBox.x &&
                amirBox.y < carBox.y + carBox.height &&
                amirBox.y + amirBox.height > carBox.y
            ) {
                isGameOver = true;
            }
        }

        function saveInfo() {
            let email = document.getElementById("playerEmail").value.trim();
            let addr = document.getElementById("walletAddress").value.trim();
            
            if (!email || !email.includes("@")) {
                alert("⚠️ الرجاء إدخال بريد إلكتروني (إيميل) صحيح.");
                return;
            }
            if (addr.length < 5) {
                alert("⚠️ الرجاء إدخال عنوان محفظة TON صحيح.");
                return;
            }

            savedEmail = email;
            savedWallet = addr;
            
            localStorage.setItem('pe_email', email);
            localStorage.setItem('pe_wallet', addr);

            alert("✅ تم حفظ الإيميل وعنوان المحفظة بنجاح!");
        }

        function watchExtraAdForFun() {
            if (adController) {
                adController.show().then(() => {
                    alert("📺 شكراً لمشاهدة الإعلان ودعم استمرار البوت!");
                }).catch((result) => {
                    console.log("Ad error or skipped", result);
                    alert("لم تكمل مشاهدة الإعلان.");
                });
            } else {
                alert("📺 شكراً لدعم البوت (وضع التجربة المحلي).");
            }
        }

        async function requestWithdraw() {
            let email = document.getElementById("playerEmail").value.trim();
            let addr = document.getElementById("walletAddress").value.trim();

            if (!email || !addr) {
                alert("⚠️ الرجاء إدخال وحفظ الإيميل وعنوان محفظة TON أولاً.");
                return;
            }

            let totalTON = (playUSD / tonPriceInUSD);

            if (totalTON < minWithdrawTON) {
                alert(`⚠️ رصيدك الحالي (${totalTON.toFixed(4)} TON) أقل من الحد الأدنى للسحب وهو (${minWithdrawTON} TON).`);
                return;
            }

            let msg = `🚀 طلب سحب أرباح TON جديد!\n📧 الإيميل: ${email}\n📍 محفظة TON: ${addr}\n💎 الإجمالي: ${totalTON.toFixed(4)} TON`;
            let sent = await sendTelegramNotification(msg);

            if (sent) {
                alert("✅ تم إرسال طلب السحب بنجاح إلى الإدارة وسيتم معالجته قريباً!");
                playUSD = 0;
                updateBalances();
            } else {
                alert("❌ حدث خطأ أثناء الإرسال، تأكد من الاتصال وحاول مرة أخرى.");
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            buildings.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, 130 - b.height, b.width, b.height);
                
                ctx.fillStyle = "rgba(255,255,255,0.6)";
                for (let wx = b.x + 8; wx < b.x + b.width - 8; wx += 12) {
                    for (let wy = 130 - b.height + 10; wy < 120; wy += 15) {
                        ctx.fillRect(wx, wy, 4, 7);
                    }
                }
            });

            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 130, canvas.width, 40);

            ctx.fillStyle = "#f1c40f";
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.fillRect(i - (score * 2) % 30, 148, 15, 3);
            }

            ctx.save();
            ctx.translate(amir.x + amir.width / 2, amir.y + amir.height / 2);
            ctx.scale(-1, 1);
            ctx.font = "26px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🏃‍♂️", 0, 2);
            ctx.restore();

            ctx.font = "24px Arial";
            ctx.fillText(obstacle.currentCar, obstacle.x, obstacle.y + 22);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#fff";
                ctx.font = "18px Tahoma";
                ctx.textAlign = "center";
                ctx.fillText("انتهت اللعبة!", canvas.width / 2, 60);
                
                ctx.font = "13px Tahoma";
                ctx.fillText("اضغط للبدء من جديد فوراً", canvas.width / 2, 95);
            }

            document.getElementById("score").innerText = score;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function resetGame() {
            score = 0;
            obstacle.x = 350;
            obstacle.speed = 2.0;
            obstacle.currentCar = getRandomCar();
            isGameOver = false;
        }

        updateBalances();
        loop();
    </script>
</body>
</html>
