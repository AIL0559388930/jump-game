<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة القفز وربح المكافآت</title>
    <!-- مكتبة إعلانات Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/adsgram.min.js?v=1"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .score-board {
            font-size: 20px;
            margin-bottom: 15px;
        }
        canvas {
            border: 2px solid #4CAF50;
            background: #111;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 15px;
            width: 360px;
        }
        .btn-ad {
            background-color: #ff9800;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="score-board">النقاط: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="360" height="480"></canvas>
    <div>
        <button class="btn" onclick="jump()">قفز (Jump)</button>
    </div>
    <div>
        <button class="btn btn-ad" onclick="showRewardedAd()">مشاهدة إعلان لمضاعفة النقاط (+50)</button>
    </div>
</div>

<script>
    let score = 0;
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // رسم اللاعب واللعبة بشكل مبدئي
    let player = { x: 50, y: 380, width: 30, height: 30, color: "#4CAF50", vy: 0, gravity: 0.6, jumpPower: -10, grounded: false };

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // رسم اللاعب
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        
        // تطبيق الجاذبية
        if (player.y < 380) {
            player.vy += player.gravity;
            player.y += player.vy;
        } else {
            player.y = 380;
            player.vy = 0;
            player.grounded = true;
        }
        requestAnimationFrame(draw);
    }
    draw();

    function jump() {
        if (player.grounded) {
            player.vy = player.jumpPower;
            player.grounded = false;
            score += 1;
            document.getElementById("score").innerText = score;
        }
    }

    // تهيئة إعلانات Adsgram بالمعرف الصحيح (بدون أخطاء)
    const adController = window.Adsgram ? window.Adsgram.init({ blockId: "1234" }) : null;

    function showRewardedAd() {
        if (adController) {
            adController.show().then(() => {
                // تم مشاهدة الإعلان بنجاح، امنح المكافأة
                score += 50;
                document.getElementById("score").innerText = score;
                alert("مبروك! حصلت على 50 نقطة إضافية!");
            }).catch((result) => {
                console.log("Ad error or skipped", result);
                alert("لم تكمل مشاهدة الإعلان، حاول مرة أخرى.");
            });
        } else {
            // وضع التجربة في حال لم يتم تحميل النظام محلياً
            score += 50;
            document.getElementById("score").innerText = score;
            alert("تم إضافة 50 نقطة (وضع التجربة المحلي).");
        }
    }
</script>

</body>
</html>
