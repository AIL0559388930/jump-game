 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعدين عملة A - مغامرة اللاعب</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #2c3e50;
            text-align: center;
            margin: 0;
            padding: 10px;
            color: #fff;
        }
        .game-container {
            background: #34495e;
            max-width: 400px;
            margin: 10px auto;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        canvas {
            background: #87CEEB;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }
        .score-board {
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .jump-btn {
            background-color: #d35400;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px #ba4a00;
        }
        .jump-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #ba4a00;
        }
        .ton-wallet-box {
            background: #1b2631;
            border: 2px solid #0088cc;
            border-radius: 10px;
            margin-top: 12px;
            padding: 10px;
            text-align: right;
        }
        .wallet-header {
            font-size: 13px;
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }
        .wallet-balance {
            font-size: 13px;
            color: #bdc3c7;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: ltr;
        }
        .wallet-balance span {
            text-align: right;
        }
        .wallet-total {
            font-size: 13px;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 8px;
            border-top: 1px dashed #4b6584;
            padding-top: 6px;
            text-align: center;
        }
        .wallet-btn-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .action-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 8px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        .support-btn {
            background-color: #8e44ad;
        }
        .copy-btn {
            background-color: #e67e22;
        }
        /* رسالة منبه التعدين العائمة */
        #miningAlert {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #27ae60;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- رسالة تعدين عملة A المتحركة -->
    <div id="miningAlert">⛏️ تم تعدين +1 عملة A بنجاح!</div>

    <div class="game-container">
        <h2>⛏️ منصة تعدين عملة A</h2>
        <div class="score-board">النقاط: <span id="score">0</span></div>
        
        <canvas id="gameCanvas" width="350" height="170"></canvas>
        
        <button class="jump-btn" onclick="makeJump()">اضغط ليقفز اللاعب ويعدن 🏃‍♂️</button>

        <!-- لوحة تعدين وحساب اللاعب النظيفة -->
        <div class="ton-wallet-box">
            <div class="wallet-header">💎 رصيد التعدين المباشر</div>
            
            <div class="wallet-balance" style="justify-content: center; font-size: 15px;">
                <span>إجمالي عملات A المعدنة: <span id="gameCoins" style="color: #2ecc71; font-weight: bold;">0</span> A</span>
            </div>

            <div class="wallet-total">
                🚀 التعدين نشط ومستمر تلقائياً مع اللعب!
            </div>
            
            <!-- أزرار التحكم والنسخ والدعم -->
            <div class="wallet-btn-group">
                <button class="action-btn copy-btn" onclick="copyGameLink()">📋 نسخ رابط اللعبة</button>
                <button class="action-btn support-btn" onclick="openSupport()">🎧 الدعم الفني</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = parseInt(localStorage.getItem('pe_score')) || 0;
        let gameCoins = parseInt(localStorage.getItem('pe_coins')) || 0;
        let isGameOver = false;

        let amir = {
            x: 40,
            y: 95,
            width: 30,
            height: 35,
            dy: 0,
            jumpPower: -10,
            gravity: 0.55,
            grounded: true
        };

        const carTypes = ["🚙", "🚗", "🚕", "🚐"];
        
        let obstacle = {
            x: 350,
            y: 100,
            width: 30,
            height: 30,
            speed: 2.0,
            currentCar: "🚙"
        };

        let buildings = [
            { x: 0, width: 60, height: 75, color: "#7f8c8d" },
            { x: 70, width: 70, height: 95, color: "#95a5a6" },
            { x: 150, width: 65, height: 85, color: "#BDC3C7" },
            { x: 225, width: 75, height: 105, color: "#65737e" },
            { x: 310, width: 60, height: 80, color: "#546e7a" }
        ];

        function getRandomCar() {
            return carTypes[Math.floor(Math.random() * carTypes.length)];
        }

        function copyGameLink() {
            const gameUrl = "https://jump-game-9pbu.vercel.app";
            navigator.clipboard.writeText(gameUrl).then(() => {
                alert("📋 تم نسخ رابط اللعبة بنجاح!");
            }).catch(() => {
                prompt("انسخ الرابط من هنا:", gameUrl);
            });
        }

        function showMiningPopup() {
            const alertBox = document.getElementById("miningAlert");
            alertBox.style.display = "block";
            setTimeout(() => {
                alertBox.style.display = "none";
            }, 1500);
        }

        function openSupport() {
            window.open('https://t.me/AIL05593889', '_blank');
        }

        function makeJump() {
            if (amir.grounded && !isGameOver) {
                amir.dy = amir.jumpPower;
                amir.grounded = false;
                
                gameCoins += 1;
                updateBalances();
                showMiningPopup();

            } else if (isGameOver) {
                resetGame(); 
            }
        }

        function updateBalances() {
            document.getElementById("gameCoins").innerText = gameCoins;
            localStorage.setItem('pe_score', score);
            localStorage.setItem('pe_coins', gameCoins);
        }

        function update() {
            if (isGameOver) return;

            amir.dy += amir.gravity;
            amir.y += amir.dy;

            if (amir.y > 95) {
                amir.y = 95;
                amir.dy = 0;
                amir.grounded = true;
            }

            buildings.forEach(b => {
                b.x -= 0.3;
                if (b.x + b.width < 0) {
                    b.x = canvas.width;
                }
            });

            obstacle.x -= obstacle.speed;
            if (obstacle.x < -30) {
                obstacle.x = 350;
                obstacle.currentCar = getRandomCar();
                score += 10;
                gameCoins += 2; 
                updateBalances();
                showMiningPopup();
            }

            let amirBox = { x: amir.x + 6, y: amir.y + 6, width: amir.width - 12, height: amir.height - 8 };
            let carBox = { x: obstacle.x + 4, y: obstacle.y + 6, width: obstacle.width - 8, height: obstacle.height - 6 };

            if (
                amirBox.x < carBox.x + carBox.width &&
                amirBox.x + amirBox.width > carBox.x &&
                amirBox.y < carBox.y + carBox.height &&
                amirBox.y + amirBox.height > carBox.y
            ) {
                isGameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            buildings.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, 130 - b.height, b.width, b.height);
                
                ctx.fillStyle = "rgba(255,255,255,0.6)";
                for (let wx = b.x + 8; wx < b.x + b.width - 8; wx += 12) {
                    for (let wy = 130 - b.height + 10; wy < 120; wy += 15) {
                        ctx.fillRect(wx, wy, 4, 7);
                    }
                }
            });

            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 130, canvas.width, 40);

            ctx.fillStyle = "#f1c40f";
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.fillRect(i - (score * 2) % 30, 148, 15, 3);
            }

            ctx.save();
            ctx.translate(amir.x + amir.width / 2, amir.y + amir.height / 2);
            ctx.scale(-1, 1);
            ctx.font = "26px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🏃‍♂️", 0, 2);
            ctx.restore();

            ctx.font = "24px Arial";
            ctx.fillText(obstacle.currentCar, obstacle.x, obstacle.y + 22);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#fff";
                ctx.font = "18px Tahoma";
                ctx.textAlign = "center";
                ctx.fillText("انتهت اللعبة!", canvas.width / 2, 60);
                
                ctx.font = "13px Tahoma";
                ctx.fillText("اضغط للبدء والتعدين من جديد", canvas.width / 2, 95);
            }

            document.getElementById("score").innerText = score;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function resetGame() {
            score = 0;
            obstacle.x = 350;
            obstacle.speed = 2.0;
            obstacle.currentCar = getRandomCar();
            isGameOver = false;
        }

        updateBalances();
        loop();
    </script>
</body>
</html>
