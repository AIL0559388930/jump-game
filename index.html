 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعدين عملة A - مغامرة اللاعب</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-black: #000000;
            --card-black: #0a0a0a;
            --yellow: #ffcc00;
            --yellow-soft: #ffe066;
            --yellow-dim: rgba(255, 204, 0, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-black);
            text-align: center;
            margin: 0;
            padding: 10px;
            color: var(--yellow);
        }

        .game-container {
            background: var(--card-black);
            border: 2px solid var(--yellow);
            max-width: 420px;
            margin: 10px auto;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 0 18px rgba(255, 204, 0, 0.16);
        }

        .game-container h2 {
            color: var(--yellow);
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 900;
        }

        canvas {
            background: #87CEEB;
            border: 2px solid var(--yellow);
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }

        .score-board {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--yellow);
        }

        .jump-btn {
            background-color: var(--yellow);
            color: #000000;
            border: 2px solid var(--yellow);
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: 900;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.25);
            transition: all 0.15s ease;
        }

        .jump-btn:hover {
            background-color: #000000;
            color: var(--yellow);
        }

        .jump-btn:active {
            transform: translateY(2px);
        }

        /* الزر الوحيد للانتقال إلى صفحة المتجر */
        .store-nav-btn {
            background-color: var(--yellow);
            color: #000000;
            border: 2px solid var(--yellow);
            padding: 13px 18px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            font-weight: 900;
            box-shadow: 0 0 14px rgba(255, 204, 0, 0.3);
            transition: all 0.15s ease;
        }

        .store-nav-btn:hover {
            background-color: #000000;
            color: var(--yellow);
        }

        .store-nav-btn:active {
            transform: translateY(2px);
        }

        .ton-wallet-box {
            background: #000000;
            border: 2px solid var(--yellow);
            border-radius: 12px;
            margin-top: 12px;
            padding: 12px;
            text-align: right;
            color: var(--yellow);
        }

        .wallet-header {
            font-size: 14px;
            color: var(--yellow);
            font-weight: 900;
            margin-bottom: 6px;
            text-align: center;
        }

        .wallet-balance {
            font-size: 14px;
            color: var(--yellow-soft);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: ltr;
        }

        .wallet-balance span {
            text-align: right;
        }

        .wallet-total {
            font-size: 13px;
            color: var(--yellow);
            font-weight: bold;
            margin-bottom: 10px;
            border-top: 1px dashed var(--yellow);
            padding-top: 8px;
            text-align: center;
        }

        .wallet-btn-group {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .action-btn {
            background-color: var(--yellow);
            color: #000000;
            border: 1.5px solid var(--yellow);
            padding: 8px;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            flex: 1;
            transition: all 0.15s ease;
        }

        .action-btn:hover {
            background-color: #000000;
            color: var(--yellow);
        }

        .disabled-withdraw-btn {
            background-color: #000000;
            color: var(--yellow-soft);
            border: 1.5px dashed var(--yellow);
            padding: 8px;
            font-size: 12px;
            border-radius: 8px;
            cursor: not-allowed;
            font-weight: 800;
            flex: 1;
        }

        #miningAlert {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--yellow);
            color: #000000;
            border: 2px solid #000000;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.35);
            z-index: 1000;
            display: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- رسالة تعدين عملة A المتحركة -->
    <div id="miningAlert">⛏️ تم تعدين عملة A بنجاح!</div>

    <div class="game-container">
        <h2>⛏️ منصة تعدين عملة A</h2>
        <div class="score-board">النقاط: <span id="score">0</span></div>

        <canvas id="gameCanvas" width="350" height="170"></canvas>

        <button class="jump-btn" onclick="makeJump()">اضغط ليقفز اللاعب ويعدن 🏃‍♂️</button>

        <!-- الزر الوحيد للانتقال إلى صفحة المتجر -->
        <button class="store-nav-btn" onclick="openStorePage()">متجر بيع وشراء عملة A</button>

        <!-- لوحة تعدين وحساب اللاعب -->
        <div class="ton-wallet-box">
            <div class="wallet-header">💎 رصيد التعدين المباشر</div>

            <div class="wallet-balance" style="justify-content: center; font-size: 15px;">
                <span>إجمالي عملات A المعدنة: <span id="gameCoins" style="color: #ffcc00; font-weight: 900;">0</span> A</span>
            </div>

            <div class="wallet-total">
                🚀 التعدين نشط ومستمر تلقائياً مع اللعب!
            </div>

            <div class="wallet-btn-group">
                <button class="disabled-withdraw-btn" onclick="alert('⚠️ خاصية سحب العملات مغلقة حالياً وسيتم تفعيلها قريباً!')">🔒 سحب عملة A (موقّف حالياً)</button>
            </div>

            <div class="wallet-btn-group">
                <button class="action-btn" onclick="copyGameLink()">📋 نسخ الرابط</button>
                <button class="action-btn" onclick="openSupport()">🎧 الدعم الفني</button>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = parseInt(localStorage.getItem('pe_score')) || 0;
        let gameCoins = parseInt(localStorage.getItem('pe_coins')) || 0;
        let isGameOver = false;

        let amir = {
            x: 40,
            y: 95,
            width: 30,
            height: 35,
            dy: 0,
            jumpPower: -10,
            gravity: 0.55,
            grounded: true
        };

        const carTypes = ["🚙", "🚗", "🚕", "🚐"];

        let obstacle = {
            x: 350,
            y: 100,
            width: 30,
            height: 30,
            speed: 2.0,
            currentCar: "🚙"
        };

        let buildings = [
            { x: 0, width: 60, height: 75, color: "#7f8c8d" },
            { x: 70, width: 70, height: 95, color: "#95a5a6" },
            { x: 150, width: 65, height: 85, color: "#BDC3C7" },
            { x: 225, width: 75, height: 105, color: "#65737e" },
            { x: 310, width: 60, height: 80, color: "#546e7a" }
        ];

        function getRandomCar() {
            return carTypes[Math.floor(Math.random() * carTypes.length)];
        }

        function copyGameLink() {
            const gameUrl = "https://jump-game-9pbu.vercel.app";
            navigator.clipboard.writeText(gameUrl).then(() => {
                alert("📋 تم نسخ رابط اللعبة بنجاح!");
            }).catch(() => {
                prompt("انسخ الرابط من هنا:", gameUrl);
            });
        }

        function showMiningPopup() {
            const alertBox = document.getElementById("miningAlert");
            alertBox.style.display = "block";
            setTimeout(() => {
                alertBox.style.display = "none";
            }, 1500);
        }

        function openSupport() {
            window.open('https://t.me/AIL05593889', '_blank');
        }

        function openStorePage() {
            let userId = "guest";
            let userName = "لاعب";

            if (
                window.Telegram &&
                window.Telegram.WebApp &&
                window.Telegram.WebApp.initDataUnsafe &&
                window.Telegram.WebApp.initDataUnsafe.user
            ) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                userId = tgUser.id || "guest";
                userName = tgUser.first_name || tgUser.username || "لاعب";
            }

            // غيّر "store.html" إلى الرابط الكامل لصفحة المتجر عند الرفع إذا لزم الأمر
            const storeUrl = new URL("store.html", window.location.href);
            storeUrl.searchParams.set("user_id", userId);
            storeUrl.searchParams.set("name", userName);
            storeUrl.searchParams.set("balance", gameCoins);

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openLink(storeUrl.toString());
            } else {
                window.location.href = storeUrl.toString();
            }
        }

        function makeJump() {
            if (amir.grounded && !isGameOver) {
                amir.dy = amir.jumpPower;
                amir.grounded = false;

                gameCoins += 1;
                updateBalances();
                showMiningPopup();
            } else if (isGameOver) {
                resetGame();
            }
        }

        function updateBalances() {
            document.getElementById("gameCoins").innerText = gameCoins;
            localStorage.setItem('pe_score', score);
            localStorage.setItem('pe_coins', gameCoins);
        }

        function update() {
            if (isGameOver) return;

            amir.dy += amir.gravity;
            amir.y += amir.dy;

            if (amir.y > 95) {
                amir.y = 95;
                amir.dy = 0;
                amir.grounded = true;
            }

            buildings.forEach(b => {
                b.x -= 0.3;
                if (b.x + b.width < 0) {
                    b.x = canvas.width;
                }
            });

            obstacle.x -= obstacle.speed;
            if (obstacle.x < -30) {
                obstacle.x = 350;
                obstacle.currentCar = getRandomCar();
                score += 10;
                gameCoins += 2;
                updateBalances();
                showMiningPopup();
            }

            let amirBox = { x: amir.x + 6, y: amir.y + 6, width: amir.width - 12, height: amir.height - 8 };
            let carBox = { x: obstacle.x + 4, y: obstacle.y + 6, width: obstacle.width - 8, height: obstacle.height - 6 };

            if (
                amirBox.x < carBox.x + carBox.width &&
                amirBox.x + amirBox.width > carBox.x &&
                amirBox.y < carBox.y + carBox.height &&
                amirBox.y + amirBox.height > carBox.y
            ) {
                isGameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            buildings.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, 130 - b.height, b.width, b.height);

                ctx.fillStyle = "rgba(255,255,255,0.6)";
                for (let wx = b.x + 8; wx < b.x + b.width - 8; wx += 12) {
                    for (let wy = 130 - b.height + 10; wy < 120; wy += 15) {
                        ctx.fillRect(wx, wy, 4, 7);
                    }
                }
            });

            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 130, canvas.width, 40);

            ctx.fillStyle = "#f1c40f";
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.fillRect(i - (score * 2) % 30, 148, 15, 3);
            }

            ctx.save();
            ctx.translate(amir.x + amir.width / 2, amir.y + amir.height / 2);
            ctx.scale(-1, 1);
            ctx.font = "26px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🏃‍♂️", 0, 2);
            ctx.restore();

            ctx.font = "24px Arial";
            ctx.fillText(obstacle.currentCar, obstacle.x, obstacle.y + 22);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffcc00";
                ctx.font = "18px Tahoma";
                ctx.textAlign = "center";
                ctx.fillText("انتهت اللعبة!", canvas.width / 2, 60);

                ctx.font = "13px Tahoma";
                ctx.fillText("اضغط للبدء والتعدين من جديد", canvas.width / 2, 95);
            }

            document.getElementById("score").innerText = score;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function resetGame() {
            score = 0;
            obstacle.x = 350;
            obstacle.speed = 2.0;
            obstacle.currentCar = getRandomCar();
            isGameOver = false;
        }

        updateBalances();
        loop();
    </script>
</body>
</html>
